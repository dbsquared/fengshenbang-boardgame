<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>封神榜 · 地牢（第一章 · 网页原型）</title>
<meta name="description" content="《封神榜》桌游第一章·地牢的纯前端网页原型：六边格地牢、4 阶段回合制、护送姬昌、单人配平辅助。双击即玩，无需安装。" />
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">
  <div id="unitTip"></div>
  <header>
    <div class="title">封神榜 · 地牢<span class="seal">封神</span></div>
    <div class="statusbar">
      <span id="phaseBadge" class="badge">移动阶段</span>
      <span id="turnInfo" class="turn">回合 1</span>
      <span id="banner" class="banner"></span>
    </div>
  </header>
  <main>
    <section class="board-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hint" id="hint">你从右侧 4 个「卒」格之一出发；选招式卡后点敌人出招；与姬昌相邻时可在「交互阶段」护送他回卒格；交互阶段可召通灵猫（移动2格/扑击1伤）。注意：姬昌只有 1 点生命，且敌方在他与玩家同时进入射程时会优先攻击他；小兵会在离你最近的卒格复活。</div>
    </section>
    <aside class="sidebar">
      <div class="panel" id="playerPanel"></div>
      <div class="panel">
        <h3>手牌 · 招式</h3>
        <div id="hand" class="hand"></div>
      </div>
      <div class="actions">
        <button id="btnRest">休整</button>
        <button id="btnEscort" disabled>护送姬昌</button>
        <button id="btnCat" disabled>召灵猫</button>
        <button id="btnEnd" class="primary">结束本阶段</button>
      </div>
      <div class="actions">
        <button id="btnStory">第一章剧情</button>
        <button id="btnRef">素材原图</button>
        <button id="btnRestart">重开本局</button>
      </div>
      <div class="panel assist">
        <h3>原型辅助（偏离原规则）</h3>
        <label><input type="checkbox" id="chkAssist" checked> 小兵复活上限 <b>1</b> 次／只（原规则：无限复活）</label>
        <label><input type="checkbox" id="chkJiHp" checked> 姬昌生命 <b>12</b>，每回合走 <b>2</b> 格（原规则：1 血／1 格）</label>
        <label><input type="checkbox" id="chkNei" checked> 单人配平：内力 <b>4</b>（原 1，补偿 4 人份输出）</label>
        <label><input type="checkbox" id="chkSolo" checked> 单人配平：小兵 <b>2</b> 只（原 4 只）</label>
        <label><input type="checkbox" id="chkDrill"> 演练模式：清空小兵（只验证护送与胜利判定）</label>
        <div class="tip-dim">第一章原为 4 人局。单人原型下「无限复活 + 姬昌 1 血 + 敌方优先攻击姬昌」几乎无法通关，故默认开启以上两项。取消勾选即回到说明书原规则。</div>
      </div>
      <div class="panel deck-panel">
        <h3>敌方行动牌库</h3>
        <div id="deckInfo"></div>
      </div>
      <div class="panel log-panel">
        <h3>战报</h3>
        <div id="log" class="log"></div>
      </div>
    </aside>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modalClose" class="modal-close" aria-label="关闭">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
